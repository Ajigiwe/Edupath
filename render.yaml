databases:
  - name: edupath-db
    databaseName: edupath
    user: edupath
    plan: free

services:
  - type: web
    name: edupath
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn educate460.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    preDeployCommand: "python manage.py migrate"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: edupath-db
          property: connectionString
